<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Relatórios — Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding:18px; background:#f5f7fb; color:#111; }
    a { color:#2b7cff; text-decoration:none; }
    h2 { margin:6px 0 12px; }
    .kpis { display:flex; gap:18px; flex-wrap:wrap; margin:12px 0; }
    .kpi { background:#fff; padding:16px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.06); min-width:140px; text-align:center; }
    .kpi h3 { margin:0 0 8px; font-size:13px; color:#666; }
    .kpi p { margin:0; font-size:22px; font-weight:700; color:#111; }
    .recent { margin-top:18px; background:#fff; padding:12px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.04); }
    .recent ul { padding-left:16px; margin:6px 0; }
    .chart { display:flex; gap:6px; align-items:end; height:120px; margin-top:12px; }
    .chart .bar { width:28px; background:#2b7cff; border-radius:4px 4px 0 0; display:inline-block; transition:transform .12s; }
    .chart .bar:hover { transform: translateY(-6px); }
    .muted { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <a href="/dashboard">← Voltar</a>
  <h2>Relatórios</h2>

  <div id="content">
    <div class="kpis">
      <div class="kpi">
        <h3>Usuários totais</h3>
        <p id="totalUsers">—</p>
      </div>
      <div class="kpi">
        <h3>Admins</h3>
        <p id="totalAdmins">—</p>
      </div>
      <div class="kpi">
        <h3>Últimos cadastrados</h3>
        <p id="recentCount">—</p>
      </div>
    </div>

    <div class="chart" id="chart" aria-hidden="true"></div>

    <div class="recent">
      <h4>Recentes</h4>
      <div id="recentList" class="muted">Carregando...</div>
    </div>
  </div>

  <script>
    async function loadReports(){
      const r = await fetch('/api/reports', { credentials: 'same-origin' });
      if (!r.ok) {
        if (r.status === 401) { location.href = '/login'; return; }
        document.getElementById('content').textContent = 'Erro ao carregar relatórios';
        return;
      }
      const data = await r.json();
      document.getElementById('totalUsers').textContent = data.totalUsers;
      document.getElementById('totalAdmins').textContent = data.totalAdmins;
      document.getElementById('recentCount').textContent = data.recentUsers.length;

      // chart simples
      const chart = document.getElementById('chart');
      chart.innerHTML = '';
      const max = Math.max(1, ...data.recentUsers.map((u,i)=>i+1));
      for (let i = 0; i < data.recentUsers.length; i++){
        const height = Math.round(((i+1) / max) * 100);
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = (20 + height) + 'px';
        bar.title = data.recentUsers[i].email + ' — ' + new Date(data.recentUsers[i].createdAt).toLocaleString();
        chart.appendChild(bar);
      }

      // lista recent users
      const list = document.createElement('ul');
      data.recentUsers.forEach(u => {
        const li = document.createElement('li');
        const d = new Date(u.createdAt);
        li.innerHTML = `<strong>${u.name || u.email}</strong> — ${u.email} <small class="muted">(${d.toLocaleString()})</small>`;
        list.appendChild(li);
      });
      const recentList = document.getElementById('recentList');
      recentList.innerHTML = '';
      recentList.appendChild(list);
    }

    loadReports();
  </script>
</body>
</html>
